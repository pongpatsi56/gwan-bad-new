<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🏸 จัดก๊วนแบดมินตัน</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green: #16a34a; --green-dark: #15803d; --green-light: #dcfce7;
      --blue: #2563eb; --blue-light: #dbeafe;
      --pink: #db2777; --pink-light: #fce7f3;
      --amber: #d97706; --amber-light: #fef3c7;
      --purple: #7c3aed; --purple-light: #ede9fe;
      --gray: #6b7280; --gray-light: #f3f4f6;
      --white: #fff; --text: #111827; --border: #e5e7eb;
      --radius: 14px; --radius-sm: 10px;
      --shadow: 0 1px 3px #0000001a; --shadow-md: 0 4px 12px #00000015;
    }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: linear-gradient(160deg, #f0fdf4 0%, #eff6ff 100%); min-height: 100vh; color: var(--text); }
    .container { max-width: 680px; margin: 0 auto; padding: 16px; }

    header { text-align: center; padding: 20px 0 8px; }
    header h1 { font-size: 1.9rem; font-weight: 900; color: var(--green-dark); }
    header p { color: var(--gray); font-size: 0.88rem; margin-top: 3px; }

    .card { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow-md); padding: 18px; margin-bottom: 14px; }
    .card-title { font-weight: 700; font-size: 0.95rem; margin-bottom: 14px; display: flex; align-items: center; gap: 6px; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 9px 18px; border: none; border-radius: var(--radius-sm); font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: filter 0.15s, transform 0.1s; line-height: 1.3; }
    .btn:hover:not(:disabled) { filter: brightness(0.91); }
    .btn:active:not(:disabled) { transform: scale(0.96); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-green { background: var(--green); color: white; }
    .btn-red { background: #ef4444; color: white; }
    .btn-gray { background: var(--gray-light); color: var(--text); }
    .btn-sm { padding: 6px 12px; font-size: 0.82rem; }
    .btn-full { width: 100%; padding: 13px; font-size: 1.05rem; border-radius: var(--radius); margin-top: 4px; }

    /* Setup */
    .add-form { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .name-input { flex: 1; min-width: 140px; padding: 9px 13px; border: 2px solid var(--border); border-radius: var(--radius-sm); font-size: 0.92rem; outline: none; transition: border-color 0.15s; }
    .name-input:focus { border-color: var(--green); }
    .gender-toggle { display: flex; border: 2px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
    .gender-toggle input[type="radio"] { display: none; }
    .gender-toggle label { padding: 9px 14px; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: background 0.15s; user-select: none; color: var(--gray); }
    .gender-toggle input[value="M"]:checked + label { background: var(--blue); color: white; }
    .gender-toggle input[value="F"]:checked + label { background: var(--pink); color: white; }

    .player-list { display: flex; flex-direction: column; gap: 7px; }
    .player-item { display: flex; align-items: center; gap: 8px; padding: 9px 12px; background: var(--gray-light); border-radius: var(--radius-sm); animation: fadeIn 0.2s ease; }
    .player-name { flex: 1; font-weight: 600; font-size: 0.92rem; min-width: 0; }
    .badge { padding: 3px 9px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; }
    .gender-badge { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
    .gender-icon { display: inline-flex; align-items: center; justify-content: center; width: 1rem; height: 1rem; border-radius: 999px; }
    .gender-icon svg { width: 0.85rem; height: 0.85rem; }
    .badge-M { background: var(--blue); color: white; }
    .badge-F { background: var(--pink); color: white; }
    .tpname { display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; font-size: 0.95rem; font-weight: 700; line-height: 1.5; }
    .remove-btn { background: none; border: none; cursor: pointer; color: var(--gray); font-size: 1.1rem; padding: 2px 6px; border-radius: 6px; transition: all 0.15s; line-height: 1; }
    .remove-btn:hover { background: #fee2e2; color: #ef4444; }
    .p-hint { text-align: center; font-size: 0.83rem; color: var(--gray); margin-top: 10px; }

    /* Game top bar */
    .game-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 8px; flex-wrap: wrap; }
    .round-pill { background: var(--green-light); color: var(--green-dark); font-weight: 800; font-size: 0.9rem; padding: 6px 16px; border-radius: 999px; }
    .top-actions { display: flex; gap: 7px; }

    /* Match card */
    .match-card { background: linear-gradient(135deg, #f0fdf4, #eff6ff); border: 2px solid var(--border); border-radius: var(--radius); padding: 20px 16px; margin-bottom: 14px; transition: background 0.3s; }
    .match-card.defending-mode { background: linear-gradient(135deg, #fffbeb, #f5f3ff); border-color: #f59e0b; }
    .match-card.pulse { animation: pulse 0.45s ease; }
    @keyframes pulse { 0% { transform: scale(0.98); opacity: 0.5; } 100% { transform: scale(1); opacity: 1; } }

    .match-label { text-align: center; font-size: 0.78rem; font-weight: 700; color: var(--gray); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }

    /* Streak banner */
    .streak-bar { text-align: center; margin-bottom: 14px; }
    .streak-pill { display: inline-block; background: #fef3c7; border: 1.5px solid #f59e0b; color: #92400e; padding: 4px 14px; border-radius: 999px; font-size: 0.82rem; font-weight: 700; }

    /* Team panels */
    .teams-grid { display: grid; grid-template-columns: 1fr 40px 1fr; gap: 12px; align-items: center; margin-bottom: 16px; }
    .team-panel { border-radius: var(--radius-sm); padding: 14px 12px; text-align: center; border: 2px solid transparent; }
    /* Normal game */
    .team-panel.t1 { background: var(--blue-light); border-color: #93c5fd; }
    .team-panel.t2 { background: var(--pink-light); border-color: #f9a8d4; }
    .t1 .team-num { color: var(--blue); }
    .t2 .team-num { color: var(--pink); }
    /* Defending mode */
    .team-panel.defender { background: #fef9c3; border-color: #f59e0b; }
    .team-panel.challenger { background: var(--purple-light); border-color: #a78bfa; }
    .defender .team-num { color: #b45309; }
    .challenger .team-num { color: var(--purple); }

    .team-num { font-size: 0.72rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    .tpname { font-size: 0.95rem; font-weight: 700; line-height: 1.5; }
    .pg { font-size: 0.8rem; opacity: 0.65; }
    .pair-type { font-size: 0.72rem; margin-top: 5px; padding: 2px 8px; border-radius: 999px; display: inline-block; }
    .pair-mixed { background: #fef9c3; color: #854d0e; font-weight: 700; }
    .pair-same { background: #f3f4f6; color: var(--gray); font-weight: 600; }
    .vs-col { text-align: center; font-size: 1.4rem; font-weight: 900; color: var(--gray); }

    /* Win buttons */
    .win-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .win-btn { padding: 12px 8px; border: none; border-radius: var(--radius-sm); font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: filter 0.15s, transform 0.1s; word-break: break-word; }
    .win-btn:hover { filter: brightness(0.88); transform: translateY(-1px); }
    .win-btn:active { transform: scale(0.96); }
    .win-btn-1 { background: var(--blue); color: white; }
    .win-btn-2 { background: var(--pink); color: white; }
    .win-btn-def { background: #f59e0b; color: white; }   /* amber - defender */
    .win-btn-chal { background: var(--purple); color: white; } /* purple - challenger */

    .score-card { border-radius: var(--radius-sm); padding: 16px; margin-bottom: 14px; background: linear-gradient(135deg, #ebf8f1, #d9f7d8); border: 1px solid #a7d7a0; }
    .scorecard-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .court-note { font-size: 0.82rem; color: #25472e; margin-top: 4px; }
    .court-view { position: relative; border: 2px solid #2d6a22; border-radius: 16px; background: #2e6b25; min-height: 420px; overflow: hidden; }
    .court-svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .court-side { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 46%; z-index: 1; }
    .court-top { top: 0; }
    .court-bottom { bottom: 0; }
    .court-net { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); z-index: 2; background: rgba(0,0,0,0.55); color: rgba(255,255,255,0.9); font-size: 0.7rem; font-weight: 800; letter-spacing: 0.14em; padding: 2px 10px; border-radius: 4px; }
    .court-team { font-weight: 800; color: rgba(255,255,255,0.95); margin-bottom: 6px; white-space: nowrap; font-size: 0.95rem; text-shadow: 0 1px 4px rgba(0,0,0,0.6); }
    .court-score { font-size: 3.6rem; font-weight: 900; letter-spacing: -0.05em; }
    .score-c1 { color: #fecaca; text-shadow: 0 0 2px rgba(0,0,0,0.9), 0 2px 16px rgba(239,68,68,0.8); }
    .score-c2 { color: #bfdbfe; text-shadow: 0 0 2px rgba(0,0,0,0.9), 0 2px 16px rgba(59,130,246,0.8); }
    .team-c1 { color: #fca5a5; text-shadow: 0 1px 4px rgba(0,0,0,0.6); }
    .team-c2 { color: #93c5fd; text-shadow: 0 1px 4px rgba(0,0,0,0.6); }
    .court-actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 14px; }
    .court-actions button { width: 100%; }
    .gender-icon { display: inline-flex; align-items: center; justify-content: center; width: 0.95rem; height: 0.95rem; border-radius: 999px; font-weight: 700; color: white; font-size: 0.75rem; margin-right: 6px; }
    .gender-letter { display: inline-flex; align-items: center; justify-content: center; width: 0.95rem; height: 0.95rem; border-radius: 999px; font-weight: 700; font-size: 0.75rem; }
    .badge-M .gender-letter { background: rgba(255,255,255,0.25); color: white; }
    .badge-F .gender-letter { background: rgba(255,255,255,0.25); color: white; }
    .gender-icon.M { background: var(--blue); }
    .gender-icon.F { background: var(--pink); }

    /* Waiting */
    .waiting-chips { display: flex; flex-wrap: wrap; gap: 7px; }
    .waiting-chip { padding: 5px 12px; background: var(--amber-light); border: 1px solid #fcd34d; border-radius: 999px; font-size: 0.82rem; font-weight: 600; color: #92400e; }

    /* Tabs */
    .tabs { display: flex; background: var(--gray-light); padding: 4px; border-radius: var(--radius-sm); margin-bottom: 14px; gap: 3px; }
    .tab-btn { flex: 1; padding: 8px 12px; border: none; background: transparent; border-radius: 7px; font-size: 0.85rem; font-weight: 600; color: var(--gray); cursor: pointer; transition: all 0.15s; }
    .tab-btn.active { background: white; color: var(--text); box-shadow: var(--shadow); }
    .tab-pane { display: none; }
    .tab-pane.active { display: block; }

    /* Stats table */
    table.stats { width: 100%; border-collapse: collapse; font-size: 0.87rem; }
    table.stats th { padding: 7px 10px; background: var(--gray-light); font-size: 0.75rem; font-weight: 700; color: var(--gray); text-transform: uppercase; letter-spacing: 0.4px; text-align: left; }
    table.stats th:not(:first-child) { text-align: center; }
    table.stats td { padding: 9px 10px; border-bottom: 1px solid var(--border); }
    table.stats td:not(:first-child) { text-align: center; font-weight: 700; }
    table.stats tr:last-child td { border-bottom: none; }
    table.stats tr.row-def td { background: #fefce8; }
    table.stats tr.row-chal td { background: #f5f3ff; }
    table.stats tr.row-t1 td { background: var(--blue-light); }
    table.stats tr.row-t2 td { background: var(--pink-light); }
    table.stats tr.row-waiting td { background: #fffbeb; }
    table.stats tr:hover td { filter: brightness(0.96); }

    /* History */
    .history-list { display: flex; flex-direction: column; gap: 7px; max-height: 380px; overflow-y: auto; }
    .history-item { padding: 9px 12px; background: var(--gray-light); border-radius: var(--radius-sm); font-size: 0.84rem; display: flex; align-items: center; gap: 10px; }
    .h-round { font-size: 0.73rem; font-weight: 800; color: var(--gray); min-width: 46px; white-space: nowrap; }
    .h-body { flex: 1; line-height: 1.6; }
    .h-def-win { font-weight: 700; color: #b45309; }
    .h-chal-win { font-weight: 700; color: var(--purple); }
    .h-normal-win { font-weight: 700; color: var(--green-dark); }
    .h-time { font-size: 0.72rem; color: var(--gray); white-space: nowrap; }

    /* Toast */
    .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-80px); background: #1e293b; color: white; padding: 10px 22px; border-radius: 999px; font-weight: 700; font-size: 0.95rem; box-shadow: 0 4px 20px #0004; z-index: 9999; transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); white-space: nowrap; pointer-events: none; }
    .toast.show { transform: translateX(-50%) translateY(0); }

    .modal { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(15,23,42,0.45); z-index: 10000; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; }
    .modal.show { opacity: 1; pointer-events: auto; }
    .modal.hidden { display: none !important; }
    .modal-card { width: min(420px, calc(100% - 32px)); border-radius: 18px; background: white; padding: 22px; box-shadow: 0 18px 45px rgba(15,23,42,0.25); }
    .modal-title { font-size: 1rem; font-weight: 800; margin-bottom: 12px; color: #111827; }
    .modal-body { font-size: 0.95rem; color: #4b5563; line-height: 1.6; margin-bottom: 18px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; }

    .empty { text-align: center; padding: 28px; color: var(--gray); }
    .empty .ei { font-size: 2.2rem; margin-bottom: 6px; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
    .hidden { display: none !important; }

    @media (max-width: 420px) {
      .teams-grid { grid-template-columns: 1fr; }
      .vs-col { text-align: center; padding: 4px 0; }
      header h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
<div id="toast" class="toast"></div>
<div id="app-modal" class="modal hidden" onclick="if (event.target === this) closeModal()">
  <div class="modal-card">
    <div id="modal-title" class="modal-title">แจ้งเตือน</div>
    <div id="modal-body" class="modal-body">...</div>
    <div class="modal-actions">
      <button id="modal-cancel" class="btn btn-gray btn-sm" onclick="closeModal()">ยกเลิก</button>
      <button id="modal-confirm" class="btn btn-green btn-sm">ยืนยัน</button>
    </div>
  </div>
</div>
<div id="confirm-modal" class="modal hidden" onclick="if (event.target === this) closeConfirmModal()">
  <div class="modal-card">
    <div class="modal-title">ยืนยันผล</div>
    <div id="confirm-text" class="modal-body"></div>
    <div class="modal-actions">
      <button class="btn btn-gray btn-sm" onclick="closeConfirmModal()">ยกเลิก</button>
      <button class="btn btn-green btn-sm" onclick="confirmRecordWin()">ยืนยัน</button>
    </div>
  </div>
</div>
<div class="container">
  <header>
    <h1>🏸 จัดก๊วนแบดมินตัน</h1>
    <p>แชมป์อยู่ต่อ · จับคู่หลากหลาย · เล่นแฟร์ทุกคน</p>
  </header>

  <!-- SETUP -->
  <div id="setup">
    <div class="card">
      <div class="card-title">👥 เพิ่มผู้เล่น</div>
      <div class="add-form">
        <input id="name-in" class="name-input" type="text" placeholder="ชื่อผู้เล่น..." maxlength="20">
        <div class="gender-toggle">
          <input type="radio" name="g" id="gM" value="M" checked>
          <label for="gM">M ชาย</label>
          <input type="radio" name="g" id="gF" value="F">
          <label for="gF">F หญิง</label>
        </div>
        <button class="btn btn-green" onclick="addPlayer()">+ เพิ่ม</button>
      </div>
      <div id="p-list" class="player-list"></div>
      <p id="p-hint" class="p-hint"></p>
      <div style="text-align:center;margin-top:10px">
        <button class="btn btn-gray btn-sm" onclick="loadMockData()" style="font-size:0.78rem;opacity:0.7">🧪 โหลดข้อมูลทดสอบ</button>
      </div>
    </div>
    <button id="start-btn" class="btn btn-green btn-full" onclick="startGame()" disabled>
      🏸 เริ่มเกม
    </button>
  </div>

  <!-- GAME -->
  <div id="game" class="hidden">
    <div class="game-top">
      <div class="round-pill" id="round-pill">เกมที่ 1</div>
      <div class="top-actions">
        <button class="btn btn-gray btn-sm" onclick="undoLastMatch()" id="undo-btn" disabled>↩️ ยกเลิก</button>
        <button class="btn btn-gray btn-sm" onclick="exportHistory('json')">⬇️ JSON</button>
        <button class="btn btn-gray btn-sm" onclick="exportHistory('csv')">⬇️ CSV</button>
        <button class="btn btn-gray btn-sm" onclick="goSetup()">✏️ ผู้เล่น</button>
        <button class="btn btn-red btn-sm" onclick="clearAll()">🗑 ล้างใหม่</button>
      </div>
    </div>

    <div class="match-card" id="match-card">
      <div class="match-label" id="match-label">⚔️ คู่แข่งขันปัจจุบัน</div>
      <div id="streak-bar"></div>
      <div class="teams-grid" id="teams-grid"></div>
      <div class="win-btns" id="win-btns"></div>
    </div>

    <div class="card score-card">
      <div class="scorecard-header">
        <div>
          <div class="card-title">🎯 นับแต้ม</div>
          <div id="score-orientation-text" class="court-note"></div>
        </div>
        <button class="btn btn-gray btn-sm" onclick="switchCourtSide()">สลับฝั่ง</button>
      </div>
      <div class="court-view" id="court-view"></div>
      <div class="court-actions">
        <button class="btn btn-gray btn-sm" onclick="incrementScore(2)">+1 ฝั่งบน</button>
        <button class="btn btn-gray btn-sm" onclick="incrementScore(1)">+1 ฝั่งล่าง</button>
        <button class="btn btn-gray btn-sm" onclick="undoScore()" id="undo-score-btn" disabled>↩ ยกเลิก +1</button>
        <button class="btn btn-gray btn-sm" onclick="resetScore()">รีเซ็ตคะแนน</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">🎮 เกม</div>
      <div id="wait-area" class="waiting-chips"></div>
    </div>

    <div class="card">
      <div class="tabs">
        <button class="tab-btn active" data-tab="stats" onclick="switchTab(this)">📊 สถิติผู้เล่น</button>
        <button class="tab-btn" data-tab="history" onclick="switchTab(this)">📋 ประวัติ</button>
      </div>
      <div id="pane-stats" class="tab-pane active"></div>
      <div id="pane-history" class="tab-pane"></div>
    </div>
  </div>
</div>

<script>
// ── STATE ──────────────────────────────────────────────────────────────────
// player: { id, name, gender, gamesPlayed, wins, waitCount, lastPartnerIds, lastOpponentIds }
// match:  { team1, team2, waiting, isDefending, streak, defenderSide }
//   team1 = defending team when isDefending=true (streak = their consecutive win count)
let S = { players: [], match: null, history: [], round: 0, started: false };
let prevState = null;
const KEY = 'badminton-v3';
function cloneState(state) {
  return JSON.parse(JSON.stringify(state));
}
function save() {
  localStorage.setItem(KEY, JSON.stringify(S));
}
function load() {
  try {
    const d = localStorage.getItem(KEY);
    if (d) { S = JSON.parse(d); normalizePlayers(); normalizeMatch(); return true; }
  } catch(e) {}
  // migrate from v2 key
  try {
    const d = localStorage.getItem('badminton-v2');
    if (d) { S = JSON.parse(d); normalizePlayers(); return true; }
  } catch(e) {}
  return false;
}
function normalizePlayers() {
  S.players.forEach(p => {
    if (!Array.isArray(p.lastPartnerIds)) {
      p.lastPartnerIds = p.lastPartnerId ? [p.lastPartnerId] : [];
    }
    if (!Array.isArray(p.lastOpponentIds)) {
      p.lastOpponentIds = p.lastOpponentIds ? p.lastOpponentIds : [];
    }
    delete p.lastPartnerId;
  });
}

function normalizeMatch() {
  if (!S.match) return;
  S.match.score1 = typeof S.match.score1 === 'number' ? S.match.score1 : 0;
  S.match.score2 = typeof S.match.score2 === 'number' ? S.match.score2 : 0;
  S.match.courtSide = S.match.courtSide === 2 ? 2 : 1;
}
function P(id) { return S.players.find(p => p.id === id); }

// ── ALGORITHM ─────────────────────────────────────────────────────────────

function hasRecentPartner(a, b) {
  return (Array.isArray(a.lastPartnerIds) && a.lastPartnerIds.includes(b.id)) ||
         (Array.isArray(b.lastPartnerIds) && b.lastPartnerIds.includes(a.id));
}

function scorePair(a, b, defenderIds, avgGames) {
  let score = 0;
  // Urgency: people who waited more or played less get priority
  score += a.waitCount * 3 + Math.max(0, avgGames - a.gamesPlayed);
  score += b.waitCount * 3 + Math.max(0, avgGames - b.gamesPlayed);
  // Mixed doubles bonus
  if (a.gender !== b.gender) score += 4;
  // Avoid repeat partners across recent rounds
  if (hasRecentPartner(a, b)) score -= 4;
  // Avoid rematch against the same defending team (check both defenders)
  if (defenderIds) {
    const d0opps = (P(defenderIds[0]).lastOpponentIds || []);
    const d1opps = (P(defenderIds[1]).lastOpponentIds || []);
    if (d0opps.includes(a.id) && d0opps.includes(b.id)) score -= 5;
    if (d1opps.includes(a.id) && d1opps.includes(b.id)) score -= 5;
  }
  return score + Math.random() * 2;
}

// Pick the best 2 challengers from pool (array of player IDs).
function pickChallengers(pool, defenderIds) {
  if (pool.length <= 2) return pool.slice();
  const avg = S.players.reduce((s, p) => s + p.gamesPlayed, 0) / S.players.length;
  let best = { score: -Infinity, pair: [pool[0], pool[1]] };
  for (let i = 0; i < pool.length - 1; i++) {
    for (let j = i + 1; j < pool.length; j++) {
      const s = scorePair(P(pool[i]), P(pool[j]), defenderIds, avg);
      if (s > best.score) best = { score: s, pair: [pool[i], pool[j]] };
    }
  }
  return best.pair;
}

// Score a split of 4 players into two pairs.
function scoreSplit(split, ids) {
  let score = 0;
  for (const [i, j] of split) {
    const a = P(ids[i]), b = P(ids[j]);
    if (a.gender !== b.gender) score += 4;
    if (hasRecentPartner(a, b)) score -= 4;
  }
  return score + Math.random() * 1.5;
}

// Pick best pairing from 4 selected IDs.
function formPairs(ids) {
  const splits = [[[0,1],[2,3]], [[0,2],[1,3]], [[0,3],[1,2]]];
  let best = { score: -Infinity, split: splits[0] };
  for (const sp of splits) {
    const s = scoreSplit(sp, ids);
    if (s > best.score) best = { score: s, split: sp };
  }
  return {
    team1: [ids[best.split[0][0]], ids[best.split[0][1]]],
    team2: [ids[best.split[1][0]], ids[best.split[1][1]]]
  };
}

// First match: pick 4 fairly from all players, form best pairs.
function genFirstMatch() {
  const n = S.players.length;
  if (n < 4) return;
  const avg = S.players.reduce((s, p) => s + p.gamesPlayed, 0) / n;
  const scored = S.players.map(p => ({
    id: p.id,
    score: p.waitCount * 3 + Math.max(0, avg - p.gamesPlayed) + Math.random() * 0.5
  })).sort((a, b) => b.score - a.score);
  const playing = scored.slice(0, 4).map(x => x.id);
  const waiting = scored.slice(4).map(x => x.id);
  const pairs = formPairs(playing);
  playing.forEach(id => { const p = P(id); if (p) p.waitCount = 0; });
  S.match = { team1: pairs.team1, team2: pairs.team2, waiting, isDefending: false, streak: 0, score1: 0, score2: 0, courtSide: 1 };
  S.round++;
}

// Next match: winners stay as defenders, pick best challengers from pool.
function genNextMatch(winnerIds, loserIds, prevWaiting, newStreak, winnerSide) {
  const pool = [...loserIds, ...prevWaiting];
  const challengers = pickChallengers(pool, winnerIds);
  const waiting = pool.filter(id => !challengers.includes(id));
  // Keep winners on the same side they were playing on
  const team1 = winnerSide === 1 ? winnerIds : challengers;
  const team2 = winnerSide === 2 ? winnerIds : challengers;
  [...team1, ...team2].forEach(id => { const p = P(id); if (p) p.waitCount = 0; });
  S.match = { team1, team2, waiting, isDefending: true, streak: newStreak, defenderSide: winnerSide, score1: 0, score2: 0, courtSide: 1 };
  S.round++;
}

// ── ACTIONS ───────────────────────────────────────────────────────────────
function addPlayer() {
  const inp = document.getElementById('name-in');
  const name = inp.value.trim();
  if (!name) { inp.focus(); return; }
  if (S.players.some(p => p.name.toLowerCase() === name.toLowerCase())) {
    showToast('มีชื่อ "' + name + '" แล้ว!'); return;
  }
  const gender = document.querySelector('input[name="g"]:checked').value;
  const id = crypto.randomUUID ? crypto.randomUUID() : Date.now() + Math.random().toString(36).slice(2);
  S.players.push({ id, name, gender, gamesPlayed: 0, wins: 0, waitCount: 0, lastPartnerIds: [], lastOpponentIds: [] });
  inp.value = ''; inp.focus();
  save(); renderSetup();
}

function removePlayer(id) {
  S.players = S.players.filter(p => p.id !== id);
  save(); renderSetup();
}

function startGame() {
  if (S.players.length < 4) return;
  prevState = null;
  S.started = true;
  genFirstMatch();
  save(); show('game'); renderGame();
}

let pendingWinTeam = null;

function requestRecordWin(team) {
  const m = S.match;
  const winnerIds = team === 1 ? m.team1 : m.team2;
  const name = winnerIds.map(id => P(id).name).join(' & ');
  pendingWinTeam = team;
  document.getElementById('confirm-text').textContent = `ยืนยันผลการแข่งขัน: ${name} ชนะ?`;
  document.getElementById('confirm-modal').classList.remove('hidden');
  document.getElementById('confirm-modal').classList.add('show');
}

function recordWin(team) {
  const m = S.match;
  const winnerIds = team === 1 ? m.team1 : m.team2;
  prevState = cloneState(S);
  const loserIds  = team === 1 ? m.team2 : m.team1;
  const isDefending = m.isDefending || false;
  const defenderSide = m.defenderSide || 1;
  const defenderWon = isDefending && team === defenderSide;

  // Update play counts
  [...m.team1, ...m.team2].forEach(id => P(id).gamesPlayed++);
  m.waiting.forEach(id => P(id).waitCount++);
  winnerIds.forEach(id => P(id).wins++);

  // Update recent partners
  m.team1.forEach(id => {
    const player = P(id);
    const partnerId = m.team1.find(x => x !== id);
    player.lastPartnerIds = [partnerId, ...(player.lastPartnerIds || [])].filter(Boolean).slice(0, 2);
  });
  m.team2.forEach(id => {
    const player = P(id);
    const partnerId = m.team2.find(x => x !== id);
    player.lastPartnerIds = [partnerId, ...(player.lastPartnerIds || [])].filter(Boolean).slice(0, 2);
  });

  // Update recent opponents
  winnerIds.forEach(id => {
    const player = P(id);
    const merged = [...loserIds, ...(player.lastOpponentIds || [])];
    player.lastOpponentIds = merged.filter((x, i, arr) => arr.indexOf(x) === i).slice(0, 4);
  });
  loserIds.forEach(id => {
    const player = P(id);
    const merged = [...winnerIds, ...(player.lastOpponentIds || [])];
    player.lastOpponentIds = merged.filter((x, i, arr) => arr.indexOf(x) === i).slice(0, 4);
  });

  // Calculate new streak for the winners
  const newStreak = defenderWon ? (m.streak || 0) + 1 : 1;

  // Save history
  const t1n = m.team1.map(id => P(id).name);
  const t2n = m.team2.map(id => P(id).name);
  S.history.unshift({
    round: S.round, t1Names: t1n, t2Names: t2n, winner: team,
    isDefending, defenderWon, oldStreak: m.streak || 0, newStreak,
    time: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })
  });

  // Toast + next match
  const MAX_STREAK = 2;
  const resultName = (team === 1 ? t1n : t2n).join(' & ');
  const rotateOut = isDefending && defenderWon && newStreak >= MAX_STREAK;

  S.history[0].rotateOut = rotateOut;

  if (!isDefending)     showToast(`🏆 ${resultName} ชนะ!`);
  else if (rotateOut)   showToast(`👑 ${resultName} ครบ 2 ชัย! ออกพักสุ่มใหม่ 🔄`);
  else if (defenderWon) showToast(`👑 ${resultName} รักษาแชมป์! ⚠️ ชนะอีกครั้งต้องออก`);
  else                  showToast(`⚡ ${resultName} โค่นแชมป์ได้!`);

  // Generate next match
  if (rotateOut) genFirstMatch();          // max streak hit → fresh fair draw
  else genNextMatch(winnerIds, loserIds, m.waiting, newStreak, team);

  save(); renderGame();
  const mc = document.getElementById('match-card');
  mc.classList.remove('pulse'); void mc.offsetWidth; mc.classList.add('pulse');
}

function confirmRecordWin() {
  if (pendingWinTeam === null) return;
  closeConfirmModal();
  recordWin(pendingWinTeam);
  pendingWinTeam = null;
}

function closeConfirmModal() {
  const modal = document.getElementById('confirm-modal');
  modal.classList.remove('show');
  modal.classList.add('hidden');
}

function showConfirm(message, onConfirm, title, confirmText, cancelText) {
  document.getElementById('modal-title').textContent = title || 'ยืนยัน';
  document.getElementById('modal-body').textContent = message;
  document.getElementById('modal-cancel').textContent = cancelText || 'ยกเลิก';
  const confirmBtn = document.getElementById('modal-confirm');
  confirmBtn.textContent = confirmText || 'ยืนยัน';
  confirmBtn.onclick = () => { closeModal(); onConfirm(); };
  const modal = document.getElementById('app-modal');
  modal.classList.remove('hidden');
  modal.classList.add('show');
}

function closeModal() {
  const modal = document.getElementById('app-modal');
  modal.classList.remove('show');
  modal.classList.add('hidden');
}

function incrementScore(side) {
  if (!S.match) return;
  if (!S.match.scoreHistory) S.match.scoreHistory = [];
  S.match.scoreHistory.push({ score1: S.match.score1, score2: S.match.score2 });
  if (side === 1) {
    S.match.courtSide === 1 ? S.match.score1++ : S.match.score2++;
  } else {
    S.match.courtSide === 1 ? S.match.score2++ : S.match.score1++;
  }
  save(); renderGame();
}

function undoScore() {
  if (!S.match || !S.match.scoreHistory || !S.match.scoreHistory.length) return;
  const prev = S.match.scoreHistory.pop();
  S.match.score1 = prev.score1;
  S.match.score2 = prev.score2;
  save(); renderGame();
}

function resetScore() {
  if (!S.match) return;
  S.match.score1 = 0;
  S.match.score2 = 0;
  S.match.scoreHistory = [];
  save(); renderGame();
}

function switchCourtSide() {
  if (!S.match) return;
  const courtView = document.getElementById('court-view');
  courtView.style.transition = 'transform 0.18s ease-in';
  courtView.style.transform = 'perspective(800px) rotateX(90deg)';
  setTimeout(() => {
    S.match.courtSide = S.match.courtSide === 1 ? 2 : 1;
    save(); renderGame();
    courtView.style.transition = 'none';
    courtView.style.transform = 'perspective(800px) rotateX(-90deg)';
    requestAnimationFrame(() => requestAnimationFrame(() => {
      courtView.style.transition = 'transform 0.18s ease-out';
      courtView.style.transform = 'perspective(800px) rotateX(0deg)';
    }));
  }, 180);
}

function goSetup() {
  prevState = null;
  S.started = false; save();
  show('setup'); renderSetup();
}

function undoLastMatch() {
  if (!prevState) {
    showToast('ไม่มีผลลัพธ์ล่าสุดให้ย้อนกลับ');
    return;
  }
  S = cloneState(prevState);
  prevState = null;
  save();
  show('game'); renderGame();
  showToast('ยกเลิกผลการแข่งขันล่าสุดแล้ว');
}

function exportHistory(format) {
  if (!S.history.length) {
    showToast('ยังไม่มีประวัติให้ส่งออก');
    return;
  }
  const data = {
    players: S.players,
    match: S.match,
    history: S.history,
    round: S.round
  };
  if (format === 'csv') {
    const rows = [
      ['round','winner','team1','team2','isDefending','defenderWon','oldStreak','newStreak','time']
    ];
    S.history.forEach(rec => {
      rows.push([
        rec.round,
        rec.winner,
        rec.t1Names.join(' & '),
        rec.t2Names.join(' & '),
        rec.isDefending ? '1' : '0',
        rec.defenderWon ? '1' : '0',
        rec.oldStreak,
        rec.newStreak,
        rec.time
      ]);
    });
    const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
    downloadFile('badminton-history.csv', csv, 'text/csv');
  } else {
    downloadFile('badminton-history.json', JSON.stringify(data, null, 2), 'application/json');
  }
}

function downloadFile(filename, content, mimeType) {
  const blob = new Blob([content], { type: mimeType });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}

function clearAll() {
  showConfirm('ล้างข้อมูลทั้งหมด?\nสถิติและประวัติจะหายทั้งหมด', () => {
    prevState = null;
    S = { players: [], match: null, history: [], round: 0, started: false };
    localStorage.removeItem(KEY);
    show('setup'); renderSetup();
  }, 'ล้างทั้งหมด', 'ล้าง', 'ยกเลิก');
}

// ── RENDER ────────────────────────────────────────────────────────────────
function h(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function genderBadge(gender) {
  return `<span class="badge gender-badge badge-${gender}"><span class="gender-letter">${gender}</span><span>${gender === 'M' ? 'ชาย' : 'หญิง'}</span></span>`;
}

function genderIcon(gender) {
  return `<span class="gender-icon ${gender}"><span class="gender-letter">${gender}</span></span>`;
}

function pairLabel(g1, g2) {
  return g1 !== g2
    ? '<span class="pair-type pair-mixed">★ คู่ผสม</span>'
    : `<span class="pair-type pair-same">${g1 === 'M' ? 'ชายคู่' : 'หญิงคู่'}</span>`;
}

function renderSetup() {
  const list = document.getElementById('p-list');
  const n = S.players.length;
  const males = S.players.filter(p => p.gender === 'M').length;
  const females = S.players.filter(p => p.gender === 'F').length;
  list.innerHTML = n === 0
    ? '<div class="empty"><div class="ei">👥</div><div>ยังไม่มีผู้เล่น เพิ่มอย่างน้อย 4 คน</div></div>'
    : S.players.map(p => `
      <div class="player-item">
        <span class="player-name">${h(p.name)}</span>
        ${genderBadge(p.gender)}
        ${p.gamesPlayed > 0 ? `<span style="font-size:0.78rem;color:var(--gray)">${p.gamesPlayed} เกม</span>` : ''}
        <button class="remove-btn" onclick="removePlayer('${p.id}')">✕</button>
      </div>`).join('');
  document.getElementById('p-hint').textContent = n < 4
    ? `${n} คน — ต้องการอีก ${4 - n} คน (M${males} F${females})`
    : `${n} คน (M${males} F${females}) — พร้อมเล่นได้เลย! 🎉`;
  document.getElementById('start-btn').disabled = n < 4;
}

function renderGame() {
  const m = S.match;
  if (!m) return;
  const defending = m.isDefending || false;
  const streak = m.streak || 0;
  const defenderSide = m.defenderSide || 1;

  document.getElementById('round-pill').textContent = `เกมที่ ${S.round}`;
  document.getElementById('undo-btn').disabled = !prevState;

  // Match card style
  const mc = document.getElementById('match-card');
  mc.classList.toggle('defending-mode', defending);

  // Label & streak bar
  document.getElementById('match-label').textContent = defending
    ? '👑 แชมป์เก่า vs ⚡ ผู้ท้าชิง'
    : '⚔️ คู่แข่งขันปัจจุบัน';

  const sbar = document.getElementById('streak-bar');
  const MAX_STREAK = 2;
  if (defending && streak >= 1) {
    const isFinal = streak >= MAX_STREAK - 1; // this is their last defense
    sbar.innerHTML = isFinal
      ? `<div class="streak-bar"><div class="streak-pill" style="background:#fee2e2;border-color:#f87171;color:#b91c1c">⚠️ แชมป์ชัยสุดท้าย! ชนะแล้วต้องออก</div></div>`
      : `<div class="streak-bar"><div class="streak-pill">🔥 รักษาแชมป์ ${streak} ชัย — อีก 1 ชัยต้องออก!</div></div>`;
  } else {
    sbar.innerHTML = '';
  }

  // Team panels
  function teamHTML(ids, role) {
    // role: 'defender' | 'challenger' | 't1' | 't2'
    const ps = ids.map(P);
    const labels = { defender: '👑 แชมป์เก่า', challenger: '⚡ ผู้ท้าชิง', t1: 'ทีม 1', t2: 'ทีม 2' };
    return `<div class="team-panel ${role}">
      <div class="team-num">${labels[role]}</div>
      ${ps.map(p => `<div class="tpname">${h(p.name)} ${genderIcon(p.gender)}</div>`).join('')}
      ${pairLabel(ps[0].gender, ps[1].gender)}
    </div>`;
  }

  const role1 = defending ? (defenderSide === 1 ? 'defender' : 'challenger') : 't1';
  const role2 = defending ? (defenderSide === 2 ? 'defender' : 'challenger') : 't2';
  document.getElementById('teams-grid').innerHTML =
    teamHTML(m.team1, role1) +
    '<div class="vs-col">VS</div>' +
    teamHTML(m.team2, role2);

  // Win buttons — defender side gets gold, challenger gets purple
  const t1n = m.team1.map(id => P(id).name).join(' & ');
  const t2n = m.team2.map(id => P(id).name).join(' & ');

  const btn2cls = !defending ? 'win-btn-2' : defenderSide === 2 ? 'win-btn-def' : 'win-btn-chal';
  const btn1txt = defending && defenderSide === 1 ? '👑 รักษาแชมป์!' : defending ? `⚡ ${h(t1n)} ชนะ!` : `🏆 ${h(t1n)} ชนะ`;
  const btn2txt = defending && defenderSide === 2 ? '👑 รักษาแชมป์!' : defending ? `⚡ ${h(t2n)} ชนะ!` : `🏆 ${h(t2n)} ชนะ`;
  document.getElementById('win-btns').innerHTML = `
    <button class="win-btn ${btn1cls}" onclick="requestRecordWin(1)">${btn1txt}</button>

    ? '<span style="color:var(--gray);font-size:0.87rem">✅ ทุกคนได้เล่นรอบนี้!</span>'
    : m.waiting.map(id => {

      }).join('');
  const courtView = document.getElementById('court-view');

    <div class="court-side court-bottom">
      <div class="court-team ${bottomTeamClass}">${h(bottomName)}</div>
      <div class="court-score ${bottomColorClass}">${bottomScore}</div>
    </div>`;
  orientationText.textContent = `คุณนับคะแนนจากฝั่งล่าง — ${bottomName}`;
  const undoScoreBtn = document.getElementById('undo-score-btn');
  if (undoScoreBtn) undoScoreBtn.disabled = !(m.scoreHistory && m.scoreHistory.length);

  renderStats(); renderHistory();
}

function renderStats() {
  const m = S.match;
  const defending = m.isDefending || false;
  const defSet  = new Set(m.team1);
  const chalSet = new Set(m.team2);
  const waitSet = new Set(m.waiting);

  const rows = [...S.players].sort((a, b) => b.gamesPlayed - a.gamesPlayed).map(p => {
    let cls, icon;
    if (defending) {
      if (defSet.has(p.id))  { cls = 'row-def';     icon = ' 👑'; }
      else if (chalSet.has(p.id)) { cls = 'row-chal'; icon = ' ⚡'; }
      else if (waitSet.has(p.id)) { cls = 'row-waiting'; icon = ' ⏳'; }
      else { cls = ''; icon = ''; }
    } else {
      if (defSet.has(p.id))  { cls = 'row-t1'; icon = ' 🏸'; }
      else if (chalSet.has(p.id)) { cls = 'row-t2'; icon = ' 🏸'; }
      else if (waitSet.has(p.id)) { cls = 'row-waiting'; icon = ' ⏳'; }
      else { cls = ''; icon = ''; }
    }
    const wp = p.gamesPlayed ? Math.round(p.wins / p.gamesPlayed * 100) : 0;
    return `<tr class="${cls}">
      <td>${genderIcon(p.gender)} ${h(p.name)}${icon}</td>
      <td>${p.gamesPlayed}</td><td>${p.waitCount}</td><td>${p.wins}</td><td>${wp}%</td>
    </tr>`;
  }).join('');

  document.getElementById('pane-stats').innerHTML = `
    <table class="stats">
      <thead><tr><th>ผู้เล่น</th><th>เกม</th><th>รอ</th><th>ชนะ</th><th>%ชนะ</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function renderHistory() {
  const el = document.getElementById('pane-history');
  if (S.history.length === 0) {
    el.innerHTML = '<div class="empty"><div class="ei">📋</div><div>ยังไม่มีประวัติการแข่งขัน</div></div>';
    return;
  }
  el.innerHTML = '<div class="history-list">' +
    S.history.map(rec => {
      const wn = (rec.winner === 1 ? rec.t1Names : rec.t2Names).join(' & ');
      const ln = (rec.winner === 1 ? rec.t2Names : rec.t1Names).join(' & ');
      let winnerHTML, loserHTML;
      if (!rec.isDefending) {
        winnerHTML = `<span class="h-normal-win">🏆 ${h(wn)}</span>`;
        loserHTML  = `<span style="color:var(--gray)"> ชนะ ${h(ln)}</span>`;
      } else if (rec.defenderWon && rec.rotateOut) {
        winnerHTML = `<span class="h-def-win">👑 ${h(wn)} ครบ 2 ชัย → ออกพัก 🔄</span>`;
        loserHTML  = `<span style="color:var(--gray)"> ชนะ ${h(ln)}</span>`;
      } else if (rec.defenderWon) {
        winnerHTML = `<span class="h-def-win">👑 ${h(wn)} รักษาแชมป์ (${rec.newStreak} ชัย)</span>`;
        loserHTML  = `<span style="color:var(--gray)"> ชนะ ${h(ln)}</span>`;
      } else {
        winnerHTML = `<span class="h-chal-win">⚡ ${h(wn)} โค่นแชมป์!</span>`;
        loserHTML  = `<span style="color:var(--gray)"> ชนะ ${h(ln)} (แชมป์ ${rec.oldStreak} ชัย)</span>`;
      }
      return `<div class="history-item">
        <div class="h-round">เกม ${rec.round}</div>
        <div class="h-body">${winnerHTML}${loserHTML}</div>
        <div class="h-time">${rec.time}</div>
      </div>`;
    }).join('') + '</div>';
}

function switchTab(btn) {
  const tab = btn.dataset.tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b === btn));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.toggle('active', p.id === 'pane-' + tab));
}

function show(screen) {
  document.getElementById('setup').classList.toggle('hidden', screen !== 'setup');
  document.getElementById('game').classList.toggle('hidden', screen !== 'game');
}

let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2800);
}

// ── MOCK DATA ─────────────────────────────────────────────────────────────
function loadMockData() {
  if (S.players.length > 0) {
    showConfirm('มีผู้เล่นอยู่แล้ว ต้องการแทนที่ด้วยข้อมูลทดสอบ?', applyMockData, 'โหลดข้อมูลทดสอบ', 'แทนที่', 'ยกเลิก');
    return;
  }
  applyMockData();
}

function applyMockData() {
  const mock = [
    { name: 'ฟลุค',   gender: 'M' },
    { name: 'ไผ่',    gender: 'M' },
    { name: 'นิกกี้', gender: 'M' },
    { name: 'อาย',    gender: 'F' },
    { name: 'ที',     gender: 'M' },
    { name: 'ใหม่',   gender: 'M' },
    { name: 'ต้นหอม', gender: 'M' },
    { name: 'เวย์',   gender: 'M' },
    { name: 'อายอาย', gender: 'F' },
    { name: 'แชมป์',  gender: 'M' },
  ];
  S.players = mock.map(m => ({
    id: crypto.randomUUID ? crypto.randomUUID() : Date.now() + Math.random().toString(36).slice(2),
    name: m.name, gender: m.gender,
    gamesPlayed: 0, wins: 0, waitCount: 0, lastPartnerIds: [], lastOpponentIds: []
  }));
  save(); renderSetup();
  showToast('โหลดข้อมูลทดสอบ 10 คนแล้ว!');
}

// ── INIT ──────────────────────────────────────────────────────────────────
document.getElementById('name-in').addEventListener('keydown', e => { if (e.key === 'Enter') addPlayer(); });

load();
if (S.started && S.match) { show('game'); renderGame(); }
else { show('setup'); renderSetup(); }
</script>
